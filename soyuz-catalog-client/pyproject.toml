[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soyuz-catalog-client"
version = "0.2.1"
description = "Generated Python client for the soyuz-catalog REST API (Unity Catalog compatible)."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Florian Hofstetter", email = "flo.max.hofstetter@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23,<0.29",
    "attrs>=22.2",
    "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/FloHofstetter/soyuz-catalog"
Repository = "https://github.com/FloHofstetter/soyuz-catalog"
Issues = "https://github.com/FloHofstetter/soyuz-catalog/issues"

[tool.hatch.build.targets.sdist]
include = ["soyuz_catalog_client", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["soyuz_catalog_client"]
