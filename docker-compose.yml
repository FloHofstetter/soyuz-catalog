services:
  postgres:
    image: postgres:17-alpine
    container_name: soyuz-postgres
    environment:
      POSTGRES_USER: soyuz
      POSTGRES_PASSWORD: soyuz  # pragma: allowlist secret
      POSTGRES_DB: soyuz
    ports:
      - "5432:5432"
    volumes:
      - soyuz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soyuz -d soyuz"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  soyuz_pg_data:
