      - Origin and relationship to Unity Catalog: concepts/origin.md
      - Architecture: concepts/architecture.md
      - Spec is the contract: concepts/spec-is-the-contract.md
      - Securables and naming: concepts/securables-and-naming.md
      - Permissions model: concepts/permissions-model.md
      - Extensions over the spec: concepts/extensions-over-spec.md
      - Table constraints: concepts/table-constraints.md
      - Lineage: concepts/lineage.md
      - Audit log: concepts/audit-log.md
      - Delta commit handling: concepts/delta-commits.md
      - Volume files: concepts/volume-files.md
