# Mutation-testing configuration (mutmut 3.x).
#
# mutmut reads this ``[mutmut]`` section because pyproject.toml carries
# no ``[tool.mutmut]`` table — we keep pyproject free of mutation config
# on purpose so the tool stays opt-in and ad-hoc.  Everything else the
# project configures (ruff / pytest / pyright / pydoclint) lives in
# pyproject.toml; this file exists solely for mutmut.
#
# Run via the wrapper, which patches the trampoline KeyError before the
# mutant CST is built:
#
#     uv run --with mutmut==3.5.0 python scripts/mutation/run_mutmut.py run
#
# See scripts/mutation/README.md for the full workflow.
[mutmut]
# The business-logic seams that are unit-tested at the function level are
# worth mutating; the rest of soyuz_catalog/ (api/ routes, models.py ORM
# declarations, settings/config, db wiring, embedded alembic) is
# integration-shell code covered end-to-end through the FastAPI
# TestClient, not at the seam mutmut probes.
#   - services/      : every CRUD + behaviour service (the bulk of the logic)
#   - storage/       : storage-URI parsing + volume-file path handling
#   - pagination.py  : opaque page-token encode/decode + bounds logic
paths_to_mutate =
    soyuz_catalog/services/
    soyuz_catalog/storage/
    soyuz_catalog/pagination.py

# mutmut copies the repo to ``mutants/`` and runs pytest with
# cwd=mutants/.  It auto-copies tests/, setup.cfg, pyproject.toml and
# .gitignore; we add the rest the suite needs at run time:
#   - soyuz_catalog/ : the non-mutated remainder of the package — api/,
#                      models.py, db.py, settings.py and the embedded
#                      alembic/ tree — which the mutated services import.
#   - scripts/       : tests/test_spec_drift.py does
#                      ``sys.path.insert(0, <repo>/scripts)`` and
#                      ``import check_spec_drift`` at module scope; without
#                      scripts/ in the mutant tree that import fails at
#                      collection and aborts the whole sweep.
# There is no frontend/ or root alembic.ini to copy:
# soyuz-catalog is a headless REST service and its
# Alembic config travels inside soyuz_catalog/alembic/.
also_copy =
    soyuz_catalog/
    scripts/

# Applied to every pytest invocation mutmut makes (stats collection,
# per-mutant runs, forced-fail, collect-only).  The default pytest
# addopts in pyproject.toml already deselect the ``integration`` and
# ``postgres`` markers, so the slow live-server / SDK / Spark / Postgres
# suites never enter the sweep — that filter is inherited via the copied
# pyproject.toml and needs no repetition here.
#
# soyuz-catalog has no source-scanning or
# docstring/signature-introspection tests that would see the mutated tree
# or the trampoline-rewritten wrappers, so no per-test deselections are
# required.  Add them here (``--deselect=…`` / ``--ignore=…``) if such a
# meta-test is ever introduced.
pytest_add_cli_args =
