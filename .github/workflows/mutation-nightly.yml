name: mutation-nightly

# Full mutation sweep over services/ + storage/ + pagination.py.
# Informational, never blocking: it uploads the survivor list + a diff
# against the committed baseline so regressions in mutation score surface
# without gating merges (the PR job is the blocking, scoped gate).
#
# NOTE: the wrapper caps workers at `cpu_count // 2` to keep heavy service
# tests under mutmut's per-mutant timeout (a fully-subscribed box turns real
# kills into masked-survivor timeouts — see scripts/mutation/run_mutmut.py).
# On a standard 2-vCPU runner that floors to 1 worker, which makes the full
# sweep slow: move it to a larger runner (and optionally raise the cap via
# `MUTMUT_MAX_CHILDREN`), or shard services/ vs storage/+pagination.py into
# a matrix, if the run approaches the timeout.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  full-mutation:
    name: full mutation sweep (services/ + storage/ + pagination.py)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --all-extras --group dev
      - name: Full mutation run
        # `|| true`: survivors make mutmut exit non-zero, but this job is
        # informational — the artifact + diff are the deliverable.
        run: uv run --with mutmut==3.5.0 python scripts/mutation/run_mutmut.py run || true
      - name: Dump results
        run: |
          uv run --with mutmut==3.5.0 python scripts/mutation/run_mutmut.py results \
            > mutation-results.txt || true
      - name: Diff against committed baseline
        run: |
          if [ -f scripts/mutation/baseline.json ]; then
            python scripts/mutation/snapshot_baseline.py --diff scripts/mutation/baseline.json \
              < mutation-results.txt | tee mutation-diff.txt || true
          else
            echo "No baseline.json committed yet — recording the current run as the first baseline." \
              | tee mutation-diff.txt
            python scripts/mutation/snapshot_baseline.py --write scripts/mutation/baseline.json \
              < mutation-results.txt || true
          fi
      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-nightly
          path: |
            mutation-results.txt
            mutation-diff.txt
            scripts/mutation/baseline.json
